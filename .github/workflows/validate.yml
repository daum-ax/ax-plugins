name: validate
on:
  push:
  pull_request:
jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: install claude CLI
        run: npm i -g @anthropic-ai/claude-code
      - name: check
        run: scripts/check.sh
